name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      KUBECONFORM_VERSION: v0.7.0
      MERMAID_CLI_VERSION: 11.17.0
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install tools
        run: |
          pip install pyyaml yamllint
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
          npm install -g "@mermaid-js/mermaid-cli@${MERMAID_CLI_VERSION}"

      - name: Validate (lint, kustomize, schemas, repo invariants, links, diagrams)
        run: hack/validate.sh

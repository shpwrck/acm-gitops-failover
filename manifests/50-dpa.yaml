# DataProtectionApplication — SAME on both hubs (docs: active and passive
# hubs must point at the same storage location).
# Set bucket, prefix, region and s3Url for your object store. The values
# below are placeholders for an S3-compatible store (SeaweedFS, Ceph RGW,
# NooBaa, ...); on AWS S3 drop s3Url + s3ForcePathStyle and set the real
# region. If the store's certificate is not publicly trusted, add its CA
# as objectStorage.caCert (base64).
# Secret first (never committed), on each hub:
#   printf '[default]\naws_access_key_id=%s\naws_secret_access_key=%s\n' "$S3_ACCESS_KEY" "$S3_SECRET_KEY" > /tmp/cloud
#   oc create secret generic cloud-credentials -n open-cluster-management-backup --from-file=cloud=/tmp/cloud \
#     --dry-run=client -o yaml | oc apply -f -
# checksumAlgorithm "" is the documented knob for non-AWS S3 providers
# (newer AWS SDK checksum headers break many S3-compatibles).
apiVersion: oadp.openshift.io/v1alpha1
kind: DataProtectionApplication
metadata:
  name: acm-dpa
  namespace: open-cluster-management-backup
  labels:
    app.kubernetes.io/part-of: acm-gitops-failover
spec:
  configuration:
    velero:
      defaultPlugins:
        - openshift
        - aws
    nodeAgent:
      enable: true
      uploaderType: kopia
  backupLocations:
    - velero:
        provider: aws
        default: true
        objectStorage:
          bucket: acm-backups
          prefix: acm
        config:
          region: us-east-1
          s3ForcePathStyle: "true"
          s3Url: https://s3.example.com
          checksumAlgorithm: ""
        credential:
          name: cloud-credentials
          key: cloud

# ClusterIssuer for Let's Encrypt production via Cloudflare DNS-01.
# Same manifest for hub and spoke. Requires secret cloudflare-api-key in the
# cert-manager namespace (created out-of-band, never committed):
#   oc create secret generic cloudflare-api-key -n cert-manager \
#     --from-literal=api-key=<CLOUDFLARE_GLOBAL_API_KEY>
# CF_EMAIL is substituted at apply time (envsubst).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ${CF_EMAIL}
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            email: ${CF_EMAIL}
            apiKeySecretRef:
              name: cloudflare-api-key
              key: api-key

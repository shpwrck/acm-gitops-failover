# Import the workload cluster `spoke` into the ACTIVE hub (context: hub-x)
# as a managed cluster. The auto-import secret (spoke kubeconfig) is created
# out-of-band, before or right after applying this file:
#   oc --context spoke config view --flatten --minify > /tmp/spoke-kubeconfig
#   oc --context hub-x create secret generic auto-import-secret -n spoke \
#     --from-file=kubeconfig=/tmp/spoke-kubeconfig
# Using a different cluster name? Change every `spoke` below AND the
# `name: spoke` selector in 61-gitops-integration.yaml. If the hub already
# has a ManagedCluster with this name, applying this file takes it over
# (including moving it into the `default` clusterset) — pick a free name.
apiVersion: cluster.open-cluster-management.io/v1
kind: ManagedCluster
metadata:
  name: spoke
  labels:
    app.kubernetes.io/part-of: acm-gitops-failover
    name: spoke
    cluster.open-cluster-management.io/clusterset: default
spec:
  hubAcceptsClient: true
---
apiVersion: agent.open-cluster-management.io/v1
kind: KlusterletAddonConfig
metadata:
  name: spoke
  namespace: spoke
  labels:
    app.kubernetes.io/part-of: acm-gitops-failover
spec:
  clusterName: spoke
  clusterNamespace: spoke
  clusterLabels:
    name: spoke
  applicationManager:
    enabled: true
  certPolicyController:
    enabled: true
  policyController:
    enabled: true
  searchCollector:
    enabled: true

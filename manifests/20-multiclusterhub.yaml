# MultiClusterHub — apply on BOTH hubs, after 10-acm-operator.yaml.
# cluster-backup is disabled by default; enabling it installs the backup
# operator and OADP into open-cluster-management-backup (needed by every
# file from 50- onward). availabilityConfig Basic = single replicas, the
# documented setting for single-node OpenShift; use High on multi-node hubs.
# A cluster that is still managed by another hub must be detached from it
# first: the hub's self-import creates a klusterlet named "klusterlet",
# which collides with the one the other hub installed.
apiVersion: operator.open-cluster-management.io/v1
kind: MultiClusterHub
metadata:
  name: multiclusterhub
  namespace: open-cluster-management
spec:
  availabilityConfig: Basic
  overrides:
    components:
      - name: cluster-backup
        enabled: true

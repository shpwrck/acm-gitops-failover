apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-failover-push
  labels:
    app: hello-failover-push
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-failover-push
  template:
    metadata:
      labels:
        app: hello-failover-push
    spec:
      containers:
        - name: httpd
          image: registry.access.redhat.com/ubi9/httpd-24:latest
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: content
              mountPath: /var/www/html
      volumes:
        - name: content
          configMap:
            name: hello-failover-push-content
